# vrag retrieval pipeline config.
# The TUI Settings screen and the self-improving loop both edit this file.

[chunking]
split_on_headings = true   # split notes at markdown headings
max_chars = 1200           # hard cap per chunk
prefix_title = false       # prepend "Note title > Heading" to each chunk

[bm25]
enabled = true
k1 = 1.5
b = 0.75
stemming = true            # German light (CISTEM-style) stemming
stopwords = true           # drop German function words at tokenisation
decompound = true          # split compounds into corpus terms ("Fahrradkette" → fahrrad + kett)

[dense]
enabled = false            # needs Ollama + `ollama pull bge-m3`; falls back to BM25 if missing
model = "bge-m3"
url = "http://localhost:11434"
cache_dir = ".vrag"        # embedding cache (sqlite-vec), gitignored
batch_size = 32            # chunks per Ollama embed request

[fusion]
method = "rrf"
rrf_k = 60
bm25_weight = 1.0          # per-stage RRF weights (only used when several stages run)
dense_weight = 1.2         # dense wins RRF ties and close calls against BM25

[graph]
enabled = false            # wikilink neighbour boost; neutral on dev, so off by default
boost = 0.05               # bonus × best min-max-normalised score of a linked note

[rerank]
enabled = false            # cross-encoder reranker; needs `uv sync --extra rerank`, else skipped
model = "BAAI/bge-reranker-v2-m3"  # Hugging Face id, downloaded on first use
top_n = 30                 # first-stage notes rescored (all their chunks, best one counts)

[search]
k = 5                      # results returned (note-level, deduplicated)
