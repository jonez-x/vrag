[project]
name = "vrag"
version = "0.1.0"
description = "Local-first retrieval for Obsidian vaults — TUI, CLI & MCP server, tuned by a self-improving eval loop"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "sqlite-vec>=0.1.6",
    "textual>=0.80",
]

[project.optional-dependencies]
rerank = ["sentence-transformers>=3.0"]  # cross-encoder reranker; pulls in torch

[project.scripts]
vrag = "vrag.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
